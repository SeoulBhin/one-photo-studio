<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 장 스튜디오</title>
<link rel="stylesheet" href="src/style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/"}}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></symbol>
</svg>

<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true"></span>한 장 스튜디오</div>
  <div class="status" id="status">제품 사진을 넣으면 시작해요</div>
  <div class="bar-right">
    <select id="size" aria-label="저장 크기">
      <option value="1080x1350">1080 × 1350</option>
      <option value="2160x2700">2160 × 2700</option>
    </select>
    <button id="save" class="primary"><svg class="ic"><use href="#i-download"/></svg>PNG 저장</button>
  </div>
</header>

<main class="shell">
  <aside class="col left">
    <div class="head">
      <h2>사진</h2>
      <div class="mini" aria-label="예시 사진">
        <button data-sample="samples/bottle_amber.png" title="예시: 갈색 앰플"><img src="samples/bottle_amber.png" alt="갈색 앰플"></button>
        <button data-sample="samples/bottle_white.png" title="예시: 흰 로션병"><img src="samples/bottle_white.png" alt="흰 로션병"></button>
      </div>
      <label class="btn ghost" for="file"><svg class="ic"><use href="#i-upload"/></svg>바꾸기</label>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div class="photo" id="editbox">
      <canvas id="edit"></canvas>
      <div class="empty" id="empty">
        <svg class="ic big"><use href="#i-image"/></svg>
        <p>제품 사진을 여기로 끌어다 놓기</p>
        <small>정면에서 찍은, 배경이 단색인 병 사진</small>
        <div class="samples">
          <button data-sample="samples/bottle_amber.png"><img src="samples/bottle_amber.png" alt="">갈색 앰플</button>
          <button data-sample="samples/bottle_white.png"><img src="samples/bottle_white.png" alt="">흰 로션병</button>
        </div>
      </div>
    </div>
    <ul class="legend">
      <li><kbd>끌기</kbd>점 옮기기</li>
      <li><kbd>더블클릭</kbd>점 추가</li>
      <li><kbd>우클릭</kbd>점 지우기</li>
      <li><i class="cap-swatch"></i>빨간 선을 끌어 뚜껑 경계</li>
    </ul>
    <div class="field">
      <label for="tol">배경 구분</label>
      <input type="range" id="tol" min="8" max="60" value="22">
      <output id="tolv" class="mono">22</output>
      <button id="redo" class="btn ghost icon" title="외곽선 다시 따기" aria-label="외곽선 다시 따기"><svg class="ic"><use href="#i-redo"/></svg></button>
    </div>
    <p class="meta mono" id="meta"></p>
  </aside>

  <section class="stage">
    <div class="viewfinder" id="viewbox">
      <canvas id="view"></canvas>
      <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
      <p class="hint" id="stagehint">사진을 넣으면 여기에 병이 선다</p>
    </div>
    <div class="under">
      <div class="seg" id="cams" role="group" aria-label="앵글"></div>
      <p class="readout" id="readout"></p>
    </div>
  </section>

  <aside class="col right">
    <section class="block">
      <div class="head"><h2>겉면</h2></div>
      <div class="tabs" id="parts" role="tablist">
        <button role="tab" data-part="body" aria-selected="true">몸통</button>
        <button role="tab" data-part="cap">뚜껑</button>
        <button role="tab" data-part="label">라벨</button>
      </div>
      <div id="finishPanel">
        <div class="finishes" id="finishes"></div>
        <div class="chips" id="colors"></div>
      </div>
      <div id="labelPanel" hidden>
        <div class="seg full" id="labelSrc" role="group" aria-label="라벨">
          <button data-src="none" aria-pressed="true">없음</button>
          <button data-src="sample">예시 라벨</button>
          <button data-src="file">내 이미지</button>
        </div>
        <input type="file" id="labelFile" accept="image/*" hidden>
        <div class="field"><label for="lpos">높이</label><input type="range" id="lpos" min="10" max="90" value="46"><output class="mono" id="lposv">46%</output></div>
        <div class="field"><label for="lsize">크기</label><input type="range" id="lsize" min="8" max="60" value="30"><output class="mono" id="lsizev">30%</output></div>
        <div class="field"><label for="lwrap">감기</label><input type="range" id="lwrap" min="60" max="300" value="150"><output class="mono" id="lwrapv">150°</output></div>
      </div>
    </section>

    <section class="block">
      <div class="head"><h2>세트</h2></div>
      <div class="sub">배경지</div>
      <div class="chips named" id="backdrops"></div>
      <div class="sub">받침</div>
      <div class="seg full" id="pedestals" role="group" aria-label="받침"></div>
    </section>

    <section class="block">
      <div class="head"><h2>조명</h2></div>
      <div class="plan">
        <div id="pad" title="위에서 본 세트 · 아래쪽이 정면">
          <i class="ring"></i><i class="prod"></i><i class="ray" id="ray"></i><b id="dot"></b>
          <span class="front">정면</span>
        </div>
        <div class="seg col2" id="lights" role="group" aria-label="조명 프리셋"></div>
      </div>
      <div class="field"><label for="power">세기</label><input type="range" id="power" min="0.4" max="4" step="0.1" value="2.4"><output class="mono" id="powerv">2.4</output></div>
    </section>
  </aside>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
